name: CI

on:
  push:
  pull_request:

jobs:
  epv:
    name: EPV (Extension Pre Validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Test the EPV gate script
        run: bash tools/tests/epv-check.test.sh
      - name: Install EPV
        run: composer require --dev phpbb/epv:dev-master --no-interaction
      - name: Run EPV
        # EPV checks packaging and coding mechanics. It is NOT proof of
        # compliance with the phpBB Extension Validation Policy, which has
        # not been verified. See docs/superpowers/specs section 14.
        #
        # --dir must point at the directory that CONTAINS vendor/extension
        # (ext/), not at the extension itself (see 66f5f87).
        #
        # EPV exits 0 even when it reports "Validation: FAILED", so the exit
        # code gates nothing. tools/epv-check.sh reads EPV's summary line and
        # fails on any fatal, error or warning; notices are shown only. A
        # missing summary line fails too.
        run: tools/epv-check.sh ./vendor/bin/EPV.php run --dir=ext

  yaml:
    name: YAML parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse every YAML file of the extension
        # The phpBB Extension Check runs a YAML check that must be error-free;
        # a file that does not even parse fails here first.
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          files = sorted(glob.glob('ext/uflagmey/donationcampaigns/config/*.yml'))
          if not files:
              sys.exit('no YAML files found')
          for name in files:
              with open(name) as handle:
                  yaml.safe_load(handle)
              print('ok', name)
          PY

  unit:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install dev toolchain
        run: composer install --no-interaction
      - name: Fetch phpBB test infrastructure
        # phpBB is read-only test infrastructure: never committed, never
        # modified, never copied into the extension package.
        run: |
          mkdir -p .phpbb-test
          curl -sSL -o /tmp/phpbb.tar.gz \
            https://github.com/phpbb/phpbb/archive/refs/tags/release-3.3.17.tar.gz
          tar xzf /tmp/phpbb.tar.gz -C .phpbb-test
          composer install --no-dev --no-interaction \
            --working-dir=.phpbb-test/phpbb-release-3.3.17/phpBB
      - name: Link the extension into the phpBB tree
        # Every suite except "unit" boots phpBB's extension manager, language
        # loader or migrator, and those resolve the extension under
        # phpBB/ext/uflagmey/donationcampaigns. Without this link they fail
        # with "language file not found" / MODULE_INFO_FILE_NOT_EXIST, which is
        # why this job used to run the unit suite only (528 of ~1600 tests).
        # A symlink, so phpBB still gets nothing copied into its tree.
        run: |
          mkdir -p .phpbb-test/phpbb-release-3.3.17/phpBB/ext/uflagmey
          ln -s "$GITHUB_WORKSPACE/ext/uflagmey/donationcampaigns" \
            .phpbb-test/phpbb-release-3.3.17/phpBB/ext/uflagmey/donationcampaigns
      - name: Run the full test suite
        run: ./vendor/bin/phpunit

  coding-standard:
    name: phpBB coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr
      - name: Install dev toolchain
        run: composer install --no-interaction
      - name: Fetch the phpBB coding standard
        # The phpBB coding standard is NOT a Composer package. It ships inside
        # the phpBB source tree at build/code_sniffer/.
        run: |
          mkdir -p .phpbb-test
          curl -sSL -o /tmp/phpbb.tar.gz \
            https://github.com/phpbb/phpbb/archive/refs/tags/release-3.3.17.tar.gz
          tar xzf /tmp/phpbb.tar.gz -C .phpbb-test
      - name: Run phpcs
        # -q suppresses the progress output that phpcs.xml enables via
        # <arg value="p"/>. Those progress dots go to stdout ahead of the
        # checkstyle report and would otherwise corrupt the XML that cs2pr
        # parses ("Start tag expected"). The report itself is unaffected, so
        # real violations are still annotated and still fail the build.
        run: ./vendor/bin/phpcs --standard=phpcs.xml --report=checkstyle -q | cs2pr

  lint:
    name: PHP lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Syntax check every PHP file
        run: find ext/uflagmey/donationcampaigns -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
